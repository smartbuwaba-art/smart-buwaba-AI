<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat Buwaba</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;background:transparent;overflow:hidden}
body{-webkit-app-region:drag;display:grid;place-items:center}
button{-webkit-app-region:no-drag;width:66px;height:66px;border:2px solid rgba(255,255,255,.92);border-radius:50%;background:linear-gradient(145deg,#8df7c2,#80e8ff);color:#08131c;font:900 31px Arial,sans-serif;box-shadow:0 7px 24px #0007,0 0 24px #80e8ff55;cursor:pointer;transition:transform .18s,box-shadow .18s}
button:hover{transform:scale(1.07);box-shadow:0 8px 28px #0008,0 0 30px #8df7c277}button:active{transform:scale(.96)}
</style>
</head>
<body>
<button type="button" aria-label="Open Chat Buwaba" title="Open Chat Buwaba">B</button>
<script>document.querySelector("button").addEventListener("click",()=>window.ChatBuwabaDesktop.openAssistant());</script>
</body>
</html>
